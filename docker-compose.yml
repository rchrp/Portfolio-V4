# Local development database. Start it with `pnpm db:up`, or let `pnpm dev`
# do it. The credentials only exist on this machine and match .env.example.
name: portfolio-v4

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_v4
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_v4"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
